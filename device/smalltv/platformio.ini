; GeekMagic SmallTV Ultra (ESP8266, ESP-12E) desk display for the Pi stats.
; Build:  local\pio\.venv\Scripts\pio run -d device/smalltv -e smalltv
; Tests:  local\pio\.venv\Scripts\pio test -d device/smalltv -e native

[env:smalltv]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=2
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
    -D SMOOTH_FONT=0

[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_src_filter = +<stats.cpp> +<layout.cpp>
test_build_src = yes
