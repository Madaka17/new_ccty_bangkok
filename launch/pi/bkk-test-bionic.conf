# Bionic mode for the Pi test server (bkk-test.service): the flood watch runs on the local model in Bionic
# (LM Studio on the PC, port 1235), reached through the PC's SSH reverse tunnel (launch/test/pi_bionic_tunnel.py)
# at 127.0.0.1:1235 on the Pi. Cloud keys and the vision and chat models stay blank (bkk-test.service).
# The flood watch takes its frames from production's saved snapshots, mounted read-only, so test never
# fetches from BMA and can never change production's files.
# On:  sudo install -D -m 644 launch/pi/bkk-test-bionic.conf /etc/systemd/system/bkk-test.service.d/bionic.conf
#      sudo systemctl daemon-reload && sudo systemctl restart bkk-test
# Off: sudo rm /etc/systemd/system/bkk-test.service.d/bionic.conf
#      sudo systemctl daemon-reload && sudo systemctl restart bkk-test
# The mount target instances/test/cache/bma_snapshots must exist before the start (it does after the first run).
[Service]
Environment=LOCAL_LLM_URL=http://127.0.0.1:1235/v1
Environment=LOCAL_LLM_MODEL=unsloth/qwen3.5-4b
Environment=LOCAL_LLM_API_KEY=lm-studio
Environment=LOCAL_LLM_MAX_PARALLEL=1
# Thinking off the LM Studio way: .env turns it off for the gateway's vLLM with LOCAL_LLM_EXTRA
# (chat_template_kwargs), which LM Studio ignores, and the 4B then thinks until max_tokens runs out.
Environment=LOCAL_LLM_REASONING=none
Environment=LOCAL_LLM_EXTRA=
# The context the model is loaded with in Bionic (.env has the gateway's 32000).
Environment=LOCAL_LLM_CONTEXT=16384
Environment=FLOOD_CAM_RESEED=300
Environment=FLOOD_CAM_WORKERS=1
Environment=FLOOD_CAM_INTERVAL=1200
Environment=FLOOD_CAM_WET_INTERVAL=600
Environment=FLOOD_CAM_MAX_PER_HOUR=600
Environment=FLOOD_CAM_STALE_MINUTES=35
Environment=HELMET_PATROL_MAX_PER_HOUR=0
Environment=WRONGWAY_MAX_PER_HOUR=0
BindReadOnlyPaths=/mnt/ssd/new_ccty_bangkok/instances/production/cache/bma_snapshots:/mnt/ssd/new_ccty_bangkok-test/instances/test/cache/bma_snapshots
